name: Continuous Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches-ignore: [main]

permissions:
  id-token: write
  contents: read


jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python: ${{ steps.filter.outputs.python }}
      infra: ${{ steps.filter.outputs.infra }}
      docker: ${{ steps.filter.outputs.docker }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'feeds.json'
              - 'pyproject.toml'
              - 'uv.lock'
            infra:
              - 'infra/**'
              - '.tflint.hcl'
            docker:
              - 'Dockerfile'
              - 'src/**'
              - 'feeds.json'
              - 'pyproject.toml'
              - 'uv.lock'
            markdown:
              - '**/*.md'

  quality-and-tests:
    name: Code Quality & Tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Python Lint and Format Check
        if: ${{ needs.changes.outputs.python == 'true' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Unit Tests
        if: ${{ needs.changes.outputs.python == 'true' }}
        run: uv run pytest

      - name: Run Markdown Lint
        if: ${{ needs.changes.outputs.markdown == 'true' }}
        run: make md-lint

  infra-security:
    name: Infrastructure & Policy Scanning
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.9.0

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/

      - name: Validate Root and Modules
        run: |
          cd infra
          tofu init -backend=false
          tofu validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Init and Run TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --chdir=infra

      - name: Scan IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  container-security:
    name: Container Build & Vulnerability Scan
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: serverless-ingestion-engine:test

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'serverless-ingestion-engine:test'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  dev-test:
    name: AWS Dev Deploy & Invariant Verification
    needs: [changes, quality-and-tests, infra-security, container-security]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.infra == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.docker == 'true' || contains(github.event.pull_request.labels.*.name, 'dev-test')) &&
      needs.quality-and-tests.result != 'failure' &&
      needs.infra-security.result != 'failure' &&
      needs.container-security.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute short commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push dev container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/serverless-ingestion-engine-dev:latest
            ${{ steps.login-ecr.outputs.registry }}/serverless-ingestion-engine-dev:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.9.0

      - name: OpenTofu Init & Apply (Dev)
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ca-central-1' }}
          TF_VAR_environment: 'dev'
          TF_VAR_vpc_id: ${{ vars.VPC_ID || secrets.VPC_ID }}
          TF_VAR_public_subnet_ids: ${{ vars.PUBLIC_SUBNET_IDS || secrets.PUBLIC_SUBNET_IDS }}
          TF_VAR_ecr_repository_url: ${{ steps.login-ecr.outputs.registry }}/serverless-ingestion-engine-dev
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL_DEV }}
        run: |
          tofu init -input=false -backend-config=environments/backend-dev.hcl
          tofu apply -auto-approve -input=false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Cloud Test Harness
        run: uv run python scripts/verify_dev_pipeline.py --environment dev --region ${{ vars.AWS_REGION || 'ca-central-1' }}

